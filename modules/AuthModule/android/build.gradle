plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.authmodule'
version = '0.1.0'

android {
  namespace "expo.modules.authmodule"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "net.openid:appauth:0.11.1"
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
}